name: guest mesa diagnostic (artifact only)

on:
  push:
    branches: [diagnostic/mali-guest-mesa]
  workflow_dispatch:
    inputs:
      release:
        description: 'Artifact only; releases are never published by this workflow'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: guest-mesa-diagnostic-${{ github.ref }}
  cancel-in-progress: false

env:
  MESA_COMMIT: cecc0e96d7193c72356a31abb0cc589e4fc0415e
  MESA_URL: https://github.com/Droid-VM/mesa.git
  MESA_SRC_DIR: ${{ github.workspace }}/mesa

jobs:
  build:
    if: github.repository == 'collegeming/mesa-cross' && inputs.release != true
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Fetch exact Mesa source and verify paired headers
        shell: bash
        run: |
          set -euo pipefail
          git init "$MESA_SRC_DIR"
          git -C "$MESA_SRC_DIR" remote add origin "$MESA_URL"
          # Full history retains the original recipe's monotonic package version.
          git -C "$MESA_SRC_DIR" fetch --filter=blob:none origin "$MESA_COMMIT"
          git -C "$MESA_SRC_DIR" checkout --detach FETCH_HEAD
          test "$(git -C "$MESA_SRC_DIR" rev-parse HEAD)" = "$MESA_COMMIT"
          test "$(git -C "$MESA_SRC_DIR" rev-parse --is-shallow-repository)" = false
          grep -Eq '^#define VK_HEADER_VERSION +358$' "$MESA_SRC_DIR/include/vulkan/vulkan_core.h"
          grep -Eq '^#define VK_HEADER_VERSION_COMPLETE VK_MAKE_API_VERSION\(0, 1, 4, VK_HEADER_VERSION\)$' "$MESA_SRC_DIR/include/vulkan/vulkan_core.h"
          git -C "$MESA_SRC_DIR" diff --exit-code HEAD --

      # GPU writes -> guest CPU reads and guest CPU writes -> GPU reads. A1 makes
      # vkFlush/vkInvalidateMappedMemoryRanges perform real cache maintenance; A2
      # invalidates declared-coherent mappings after vkWaitSemaphores/
      # vkWaitForFences/vkQueueWaitIdle; CMap invalidates the range a vkMapMemory
      # is about to return; CUnmap cleans the range a vkUnmapMemory releases. All
      # four run by default; GFXSTREAM_GUEST_INVALIDATE=0/off restores the
      # pre-patch behaviour, and GFXSTREAM_GUEST_INVALIDATE_STATS=1 adds counters.
      - name: Apply readback-invalidate and imageview handle guard patches and assert boundaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python3 -I ./patch-guest-readback-invalidate.py "$MESA_SRC_DIR" \
            --diff out/guest-readback-invalidate.patch | tee out/patch-checks.txt
          # The new header is untracked: mark it intent-to-add so the path checks
          # and the post-build re-check see it.
          git -C "$MESA_SRC_DIR" add -N src/gfxstream/guest/vulkan_enc/GuestCacheMaintenance.h
          python3 -I ./check-guest-readback-invalidate.py "$MESA_SRC_DIR" \
            --diff out/guest-readback-invalidate.patch | tee out/patch-static-checks.txt
          # Host-compiled unit test of the real header: the switch and the range
          # math are pure logic; the aarch64 cache instructions are stubs on x86.
          g++ -std=c++17 -Wall -Wextra -Werror -pthread \
            -I "$MESA_SRC_DIR/src/gfxstream/guest/vulkan_enc" \
            ./test-guest-cache-maintenance.cpp -o out/test-guest-cache-maintenance
          out/test-guest-cache-maintenance | tee out/unit-tests.txt
          # G1/G2: on_vkCreateImageView rejects a VkImage that is not a live wrapper
          # before encoding it, and GFXSTREAM_IMGID_DIAG=1 traces view/create/destroy
          # handles. Runs on top of the readback patch: the script asserts the
          # post-patch sha256 of ResourceTracker.cpp and adds no file.
          python3 -I ./patch-guest-imageview-handle-guard.py "$MESA_SRC_DIR" \
            --diff out/guest-imageview-handle-guard.patch | tee out/guard-patch-checks.txt
          git -C "$MESA_SRC_DIR" diff --check
          git -C "$MESA_SRC_DIR" diff --name-only HEAD -- | sort > out/patched-paths.txt
          printf '%s\n' \
            src/gfxstream/guest/vulkan_enc/GuestCacheMaintenance.h \
            src/gfxstream/guest/vulkan_enc/ResourceTracker.cpp \
            src/gfxstream/guest/vulkan_enc/ResourceTracker.h \
            src/gfxstream/guest/vulkan_enc/Validation.cpp \
            src/gfxstream/guest/vulkan_enc/autogenerated/VkEncoder.cpp \
            | sort > out/expected-paths.txt
          diff -u out/expected-paths.txt out/patched-paths.txt
          sha256sum \
            "$MESA_SRC_DIR/src/gfxstream/guest/vulkan_enc/GuestCacheMaintenance.h" \
            "$MESA_SRC_DIR/src/gfxstream/guest/vulkan_enc/ResourceTracker.cpp" \
            "$MESA_SRC_DIR/src/gfxstream/guest/vulkan_enc/ResourceTracker.h" \
            "$MESA_SRC_DIR/src/gfxstream/guest/vulkan_enc/Validation.cpp" \
            "$MESA_SRC_DIR/src/gfxstream/guest/vulkan_enc/autogenerated/VkEncoder.cpp" \
            > out/patched-sources.sha256

      - uses: docker/setup-buildx-action@v3

      - name: Original Docker cross environment
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.mesa-cross
          tags: droidvm-mesa-cross:latest
          load: true
          cache-from: type=gha,scope=mesa-cross-env
          cache-to: type=gha,mode=max,scope=mesa-cross-env,ignore-error=true

      - name: Build pinned guest with the readback-invalidate and imageview guard patches
        env:
          MESA_NO_IMAGE_BUILD: '1'
        shell: bash
        run: |
          set -euo pipefail
          bash ./ci-build.sh droidvm "$PWD/out"
          # The build must not modify sources and must leave exactly the five
          # patched files changed -- no silent extra edit from the recipe.
          sha256sum -c out/patched-sources.sha256
          test "$(git -C "$MESA_SRC_DIR" diff --name-only HEAD -- | sort)" = \
               "$(cat out/expected-paths.txt)"
          git -C "$MESA_SRC_DIR" diff --check
          grep -Fx "MESA_COMMIT=$MESA_COMMIT" out/build.env

      - name: Record provenance and inspect AArch64 dependencies
        shell: bash
        env:
          RECIPE_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          {
            printf 'RUN_URL=%s\nRECIPE_REPOSITORY=%s\nRECIPE_REF=%s\nRECIPE_SHA=%s\n' "$RUN_URL" "$GITHUB_REPOSITORY" "$GITHUB_REF" "$RECIPE_SHA"
            printf 'MESA_URL=%s\nVULKAN_HEADERS=1.4.358\nRELEASE=false\n' "$MESA_URL"
            printf 'MESA_TREE=%s\n' "$(git -C "$MESA_SRC_DIR" rev-parse 'HEAD^{tree}')"
            printf 'MESA_PATCH=guest-readback-invalidate-a1-a2-cmap-cunmap-default-on-stats-v3\nMESA_WORKTREE_DIRTY=true\n'
            printf 'MESA_PATCH_GUARD=guest-imageview-handle-guard-g1-g2-v1\n'
            printf 'GFXSTREAM_GUEST_INVALIDATE=on_by_default; =0|off disables; modes=1|on|all|a1|a2|cmap|cunmap|comma-list\n'
            printf 'GFXSTREAM_GUEST_INVALIDATE_STATS=opt_in; GUEST-CMO-STATS line at exit or SIGUSR1\n'
            printf 'GFXSTREAM_IMGID_DIAG=opt_in; IMGID view/create/destroy handle lines\n'
            sha256sum patch-guest-readback-invalidate.py patch-guest-imageview-handle-guard.py check-guest-readback-invalidate.py test-guest-cache-maintenance.cpp out/guest-readback-invalidate.patch out/guest-imageview-handle-guard.patch out/patched-sources.sha256
            docker image inspect droidvm-mesa-cross:latest --format 'DOCKER_IMAGE_ID={{.Id}}'
            sha256sum Dockerfile.mesa-cross build.sh build-in-container.sh ci-build.sh mesa-config.sh package.sh aarch64-linux-gnu.meson aarch64-llvm-config ubuntu.sources
          } > out/provenance.txt
          docker run --rm -v "$PWD/out:/out" -v "$MESA_SRC_DIR:/mesa:ro" droidvm-mesa-cross:latest bash -euo pipefail -c '
            dpkg-query -W > /out/build-packages.txt
            dpkg-deb -f /out/*.deb > /out/debian-control.txt
            root=$(mktemp -d)
            dpkg-deb -x /out/*.deb "$root"
            find "$root" -type f -name "*.so*" -print0 | while IFS= read -r -d "" so; do
              printf "\n=== %s ===\n" "${so#"$root"}"
              aarch64-linux-gnu-readelf -h "$so" | grep Machine
              aarch64-linux-gnu-readelf -d "$so" | grep -E "NEEDED|SONAME|RPATH|RUNPATH" || true
              aarch64-linux-gnu-readelf --version-info "$so" | grep -E "Name: (GLIBC|GLIBCXX|CXXABI)" || true
            done > /out/elf-dependencies.txt
            test -n "$(find "$root" -name "libvulkan_gfxstream.so" -print -quit)"
            test -n "$(find "$root" -name "libEGL_mesa.so*" -print -quit)"
            test -n "$(find "$root" -name "libgbm.so*" -print -quit)"
            # The guard and its trace lines must be present as strings in the ICD.
            so=$(find "$root" -name "libvulkan_gfxstream.so" -print -quit)
            grep -a -q "non-boxed VkImage" "$so"
            grep -a -q "IMGID view " "$so"
            grep -a -q "IMGID create " "$so"
            grep -a -q "IMGID destroy " "$so"
            cp /mesa/build-cross/meson-info/intro-buildoptions.json /out/meson-buildoptions.json
            cp /mesa/build-cross/meson-logs/meson-log.txt /out/meson-log.txt
          '
          (cd out && sha256sum *.deb > SHA256SUMS)
          printf 'Artifact only: %s\n\nMesa: %s\n\nVulkan Headers: 1.4.358\n' "$RUN_URL" "$MESA_COMMIT" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: mesa-guest-deb
          path: out/
          if-no-files-found: error
          retention-days: 30
