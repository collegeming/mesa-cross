name: MaliBridge wl_teardown no-detach shim A-B (client only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    container: ubuntu:26.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      MB_REVISION: 47ec18eaa9d9f83c359d56ba412a17d61ba59a66
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install native client build dependencies
        run: |
          set -euo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build git ca-certificates python3 \
            libxcb1-dev libx11-dev libwayland-dev binutils zstd
          test "$(uname -m)" = aarch64
      - name: Fetch exact upstream source
        run: |
          set -euo pipefail
          git init malibridge
          git -C malibridge remote add origin https://github.com/ASEbrahim/MaliBridge.git
          git -C malibridge fetch --depth 1 origin "$MB_REVISION"
          git -C malibridge checkout --detach FETCH_HEAD
          test "$(git -C malibridge rev-parse HEAD)" = "$MB_REVISION"
          test "$(git -C malibridge rev-parse HEAD:third_party/Vulkan-Headers-1.4.341)" = 5cc90b8046cbfbd4638e0c2d0397938dab41a4ce
          test -f malibridge/third_party/Vulkan-Headers-1.4.341/include/vulkan/vulkan.h
          test -f malibridge/common/gen/vkb_gen_client.c
          python3 -I diagnostics/malibridge-format-capacity-patch.py --check malibridge
          python3 -I diagnostics/malibridge-wsi-lifecycle-patch.py --check malibridge
      - name: Build the wl_surface-gone baseline, then the no-detach candidate, and the shim
        run: |
          set -euo pipefail
          mkdir -p stage/build-info stage/shim
          dpkg-query -W > stage/build-info/build-packages.txt
          git -C malibridge rev-parse HEAD > stage/build-info/source-revision.txt
          git -C malibridge ls-tree HEAD client/wsi_wayland.c client/wsi.c client/wsi.h CMakeLists.txt \
            common/gen/vkb_gen_client.c third_party/Vulkan-Headers-1.4.341 \
            > stage/build-info/source-blobs.txt
          cmake -S malibridge -B mb-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 -DBUILD_VARIANT=linux-aarch64
          cp mb-build/CMakeCache.txt stage/build-info/
          gcc -O2 -o stage/build-info/wsi-smoke diagnostics/malibridge-wsi-smoke.c \
            -I malibridge/third_party/Vulkan-Headers-1.4.341/include -ldl
          gcc -O2 -Wall -o stage/build-info/wl-gone-smoke diagnostics/malibridge-wl-gone-smoke.c \
            -lwayland-client
          gcc -O2 -Wall -Wextra -shared -fPIC -o stage/shim/libvkb_wl_gone.so \
            diagnostics/malibridge-wl-gone-shim.c -ldl -lpthread
          # baseline: the wl_surface-gone candidate the device already has (capacity + lifecycle + hook)
          python3 -I diagnostics/malibridge-format-capacity-patch.py malibridge \
            | tee stage/build-info/patch-input-fingerprints.txt
          python3 -I diagnostics/malibridge-format-capacity-patch.py --verify-candidate malibridge
          python3 -I diagnostics/malibridge-wsi-lifecycle-patch.py malibridge \
            | tee -a stage/build-info/patch-input-fingerprints.txt
          python3 -I diagnostics/malibridge-wsi-lifecycle-patch.py --verify-candidate malibridge
          python3 -I diagnostics/malibridge-wl-gone-patch.py malibridge \
            | tee -a stage/build-info/patch-input-fingerprints.txt
          python3 -I diagnostics/malibridge-wl-gone-patch.py --verify-candidate malibridge
          python3 -I diagnostics/malibridge-hook2-patch.py --check malibridge
          git -C malibridge diff --check
          git -C malibridge diff > stage/build-info/wl-gone.patch
          for mode in baseline candidate; do
            if [ "$mode" = candidate ]; then
              # Exactly the no-detach change on top of the baseline above.
              python3 -I diagnostics/malibridge-hook2-patch.py malibridge \
                | tee -a stage/build-info/patch-input-fingerprints.txt
              python3 -I diagnostics/malibridge-hook2-patch.py --verify-candidate malibridge
              git -C malibridge diff --check
              git -C malibridge diff > stage/build-info/candidate.patch
            fi
            cmake --build mb-build --target vulkan_droidbridge --parallel 4 \
              | tee "stage/build-info/$mode-build.log"
            mkdir -p "stage/$mode/lib" "stage/$mode/share/vulkan/icd.d"
            cp mb-build/libvulkan_droidbridge.so "stage/$mode/lib/"
            MODE="$mode" python3 -I - <<'PY'
          import json, os
          from pathlib import Path
          p = Path('stage') / os.environ['MODE'] / 'share/vulkan/icd.d/droidbridge_icd.json'
          p.write_text(json.dumps({'file_format_version': '1.0.0', 'ICD': {
              'library_path': '../../../lib/libvulkan_droidbridge.so',
              'api_version': '1.4.341'}}, indent=2) + '\n')
          PY
            lib="stage/$mode/lib/libvulkan_droidbridge.so"
            readelf -h "$lib" | tee "stage/build-info/$mode-elf.txt" | grep 'Machine:.*AArch64'
            readelf -d "$lib" > "stage/build-info/$mode-dynamic.txt"
            readelf --version-info "$lib" > "stage/build-info/$mode-symbol-versions.txt"
            ldd "$lib" > "stage/build-info/$mode-ldd.txt"
            ! grep 'not found' "stage/build-info/$mode-ldd.txt"
            grep -E 'SONAME|NEEDED' "stage/build-info/$mode-dynamic.txt" \
              > "stage/build-info/$mode-abi.txt"
            nm -D --defined-only "$lib" | awk '{print $2, $3}' | sort \
              > "stage/build-info/$mode-exports.txt"
            VKBRIDGE_SOCKET="$PWD/stage/no-socket" timeout 30 \
              stage/build-info/wsi-smoke "$PWD/$lib" 2>&1 \
              | sed -E 's/\[[A-Za-z0-9._-]+ [0-9]+\]/[process]/g' \
              > "stage/build-info/$mode-smoke.txt"
            sha256sum "$lib" > "stage/build-info/$mode-SHA256SUMS"
          done
          cmp -s stage/baseline/lib/libvulkan_droidbridge.so stage/candidate/lib/libvulkan_droidbridge.so && exit 1
          bw=$(grep -c 'warning:' stage/build-info/baseline-build.log || true)
          cw=$(grep -c 'warning:' stage/build-info/candidate-build.log || true)
          printf 'baseline warnings: %s, candidate warnings: %s\n' "${bw:-0}" "${cw:-0}" \
            > stage/build-info/warnings.txt
          [ "${cw:-0}" -le "${bw:-0}" ]
          # Same ABI and exports: this change removes requests, it adds no symbol.
          cmp -s stage/build-info/baseline-abi.txt stage/build-info/candidate-abi.txt
          cmp -s stage/build-info/baseline-exports.txt stage/build-info/candidate-exports.txt
          cmp -s stage/build-info/baseline-smoke.txt stage/build-info/candidate-smoke.txt
          grep -q '^T vkb_wayland_surface_gone$' stage/build-info/candidate-exports.txt
          # The baseline still traces the detach; the candidate must not queue it.
          strings stage/baseline/lib/libvulkan_droidbridge.so | grep -F 'detach wl_surface' \
            > stage/build-info/baseline-detach-marker.txt
          ! strings stage/candidate/lib/libvulkan_droidbridge.so | grep -F 'detach wl_surface'
          strings stage/candidate/lib/libvulkan_droidbridge.so | grep -F 'wl_surface destroyed first' \
            > stage/build-info/candidate-gone-marker.txt
          strings stage/candidate/lib/libvulkan_droidbridge.so | grep -F 'vkb-wsi: ' \
            > stage/build-info/candidate-trace-marker.txt
          # The shim: aarch64, interposes only the one libwayland entry point, no missing deps.
          readelf -h stage/shim/libvkb_wl_gone.so | grep 'Machine:.*AArch64'
          nm -D --defined-only stage/shim/libvkb_wl_gone.so | awk '{print $2, $3}' | sort \
            > stage/build-info/shim-exports.txt
          printf 'T wl_proxy_marshal_flags\n' > stage/build-info/shim-exports-expected.txt
          cmp -s stage/build-info/shim-exports.txt stage/build-info/shim-exports-expected.txt
          ldd stage/shim/libvkb_wl_gone.so > stage/build-info/shim-ldd.txt
          ! grep 'not found' stage/build-info/shim-ldd.txt
          # Shim end to end, no compositor: the ICD opened RTLD_LOCAL must be found through
          # /proc/self/maps, its hook called, and a registry miss must be a no-op.
          VKBRIDGE_WSI_TRACE=1 VKBRIDGE_WLHOOK_TRACE=1 \
            LD_PRELOAD="$PWD/stage/shim/libvkb_wl_gone.so" \
            stage/build-info/wl-gone-smoke "$PWD/stage/candidate/lib/libvulkan_droidbridge.so" \
            > stage/build-info/shim-smoke.out 2> stage/build-info/shim-smoke.err
          grep -q '^wl-gone-smoke=OK$' stage/build-info/shim-smoke.out
          grep -F 'vkb-wlhook: wl_surface destroy -> vkb_wayland_surface_gone' stage/build-info/shim-smoke.err
          grep -F 'vkb-wsi: wl_surface destroyed first: 0 surface(s) marked' stage/build-info/shim-smoke.err
          grep -F 'vkb-wlhook: wl_surface destroys 1, hooked 1, misses 0' stage/build-info/shim-smoke.err
          stage/build-info/wl-gone-smoke "$PWD/stage/candidate/lib/libvulkan_droidbridge.so" \
            > stage/build-info/shim-control.out 2> stage/build-info/shim-control.err
          grep -q '^wl-gone-smoke=OK$' stage/build-info/shim-control.out
          ! grep -q 'vkb-wlhook' stage/build-info/shim-control.err
          cp -a diagnostics/malibridge-format-capacity-patch.py diagnostics/malibridge-wsi-lifecycle-patch.py \
            diagnostics/malibridge-wl-gone-patch.py diagnostics/malibridge-hook2-patch.py \
            diagnostics/malibridge-wl-gone-shim.c diagnostics/malibridge-wl-gone-smoke.c \
            diagnostics/malibridge-wsi-smoke.c stage/build-info/
          cp diagnostics/malibridge-wl-gone-shim.c stage/shim/
          sha256sum stage/shim/libvkb_wl_gone.so > stage/shim/SHA256SUMS
          ! find stage -type f -name '*server*.so' | grep .
          tar --zstd -cf malibridge-hook2-aarch64.tar.zst -C stage .
          sha256sum malibridge-hook2-aarch64.tar.zst > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: malibridge-hook2-aarch64
          path: |
            malibridge-hook2-aarch64.tar.zst
            SHA256SUMS
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        name: malibridge-hook2-build-logs
        with:
          path: |
            stage/build-info/
            mb-build/CMakeFiles/CMakeConfigureLog.yaml
            mb-build/CMakeCache.txt
