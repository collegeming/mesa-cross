name: MaliBridge server memory budget A-B (server only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      MB_REVISION: 47ec18eaa9d9f83c359d56ba412a17d61ba59a66
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install build dependencies
        run: |
          set -euo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build git ca-certificates python3 curl unzip zstd \
            gcc-aarch64-linux-gnu libc6-dev-arm64-cross binutils-aarch64-linux-gnu
      - name: Fetch exact upstream source
        run: |
          set -euo pipefail
          git init malibridge
          git -C malibridge remote add origin https://github.com/ASEbrahim/MaliBridge.git
          git -C malibridge fetch --depth 1 origin "$MB_REVISION"
          git -C malibridge checkout --detach FETCH_HEAD
          test "$(git -C malibridge rev-parse HEAD)" = "$MB_REVISION"
          test "$(git -C malibridge rev-parse HEAD:third_party/Vulkan-Headers-1.4.341)" = 5cc90b8046cbfbd4638e0c2d0397938dab41a4ce
          test -f malibridge/third_party/Vulkan-Headers-1.4.341/include/vulkan/vulkan.h
          test -f malibridge/common/gen/vkb_gen_server.c
          python3 -I diagnostics/malibridge-mem-budget-patch.py --check malibridge
      - name: Fetch Android NDK
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 5 -o ndk.zip https://dl.google.com/android/repository/android-ndk-r27c-linux.zip
          mkdir ndk
          unzip -q ndk.zip -d ndk
          echo "NDK=$PWD/ndk/android-ndk-r27c" >> "$GITHUB_ENV"
      - name: Build baseline and candidate server
        run: |
          set -euo pipefail
          mkdir -p stage/build-info
          dpkg-query -W > stage/build-info/build-packages.txt
          git -C malibridge rev-parse HEAD > stage/build-info/source-revision.txt
          git -C malibridge ls-tree HEAD server/server_memory.c server/server_instance.c server/server_main.c \
            server/vkb_server.h common/gen/vkb_gen_server.c third_party/Vulkan-Headers-1.4.341 \
            > stage/build-info/source-blobs.txt
          for mode in baseline candidate; do
            if [ "$mode" = candidate ]; then
              python3 -I diagnostics/malibridge-mem-budget-patch.py malibridge \
                | tee stage/build-info/patch-input-fingerprints.txt
              python3 -I diagnostics/malibridge-mem-budget-patch.py --verify-candidate malibridge
              git -C malibridge diff --check
              git -C malibridge diff > stage/build-info/mem-budget.patch
            fi
            cmake -S malibridge -B "mb-build-$mode" -G Ninja \
              -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-29 \
              -DCMAKE_BUILD_TYPE=Release
            cp "mb-build-$mode/CMakeCache.txt" "stage/build-info/$mode-CMakeCache.txt"
            cmake --build "mb-build-$mode" --target vkbridge_server --parallel 4 \
              | tee "stage/build-info/$mode-build.log"
            mkdir -p "stage/$mode"
            cp "mb-build-$mode/libvkbridge_server.so" "stage/$mode/vkbridge-server"
            chmod 755 "stage/$mode/vkbridge-server"
            readelf -h "stage/$mode/vkbridge-server" | tee "stage/build-info/$mode-elf.txt" | grep 'Machine:.*AArch64'
            readelf -d "stage/$mode/vkbridge-server" > "stage/build-info/$mode-dynamic.txt"
            readelf --version-info "stage/$mode/vkbridge-server" > "stage/build-info/$mode-symbol-versions.txt"
            readelf -l "stage/$mode/vkbridge-server" > "stage/build-info/$mode-program-headers.txt"
            sha256sum "stage/$mode/vkbridge-server" > "stage/build-info/$mode-SHA256SUMS"
          done
          cmp -s stage/baseline/vkbridge-server stage/candidate/vkbridge-server && exit 1
          if strings stage/baseline/vkbridge-server | grep -Fq 'memory budget:'; then
            echo 'baseline unexpectedly contains the budget marker' >&2
            exit 1
          fi
          strings stage/candidate/vkbridge-server | grep -F 'memory budget:' > stage/build-info/candidate-budget-marker.txt
          strings stage/candidate/vkbridge-server | grep -F 'MemAvailable is under the floor' \
            > stage/build-info/candidate-floor-marker.txt
          bw=$(grep -c 'warning:' stage/build-info/baseline-build.log || true)
          cw=$(grep -c 'warning:' stage/build-info/candidate-build.log || true)
          printf 'baseline warnings: %s, candidate warnings: %s\n' "${bw:-0}" "${cw:-0}" \
            > stage/build-info/warnings.txt
          [ "${cw:-0}" -le "${bw:-0}" ]
      - name: Build controlled client probe
        run: |
          set -euo pipefail
          mkdir -p stage/probe
          aarch64-linux-gnu-gcc -O2 -Wall -Wextra -o stage/probe/mb-mem-probe diagnostics/mb-mem-probe.c \
            -I malibridge/third_party/Vulkan-Headers-1.4.341/include -ldl
          chmod 755 stage/probe/mb-mem-probe
          readelf -h stage/probe/mb-mem-probe | tee stage/build-info/probe-elf.txt | grep 'Machine:.*AArch64'
          readelf -d stage/probe/mb-mem-probe > stage/build-info/probe-dynamic.txt
          sha256sum stage/probe/mb-mem-probe > stage/build-info/probe-SHA256SUMS
          cp diagnostics/malibridge-mem-budget-patch.py diagnostics/mb-mem-probe.c stage/build-info/
      - name: Package
        run: |
          set -euo pipefail
          tar --zstd -cf malibridge-mem-budget-aarch64.tar.zst -C stage .
          sha256sum malibridge-mem-budget-aarch64.tar.zst > SHA256SUMS
          tar --zstd -tf malibridge-mem-budget-aarch64.tar.zst | sort > stage/build-info/archive-contents.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: malibridge-mem-budget-aarch64
          path: |
            malibridge-mem-budget-aarch64.tar.zst
            SHA256SUMS
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: malibridge-mem-budget-build-logs
          path: |
            stage/build-info/
            mb-build-baseline/CMakeFiles/CMakeConfigureLog.yaml
            mb-build-candidate/CMakeFiles/CMakeConfigureLog.yaml
            mb-build-baseline/CMakeCache.txt
            mb-build-candidate/CMakeCache.txt
